[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-ops-agent"
version = "0.1.0"
description = "Mock global business travel operations agent prototype"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
travel-agent = "travel_agent.app:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
travel_agent = ["schemas/*.json"]
